name: daily-etl

on:
  schedule:
    - cron: "30 17 * * *"   # 17:30 UTC = 23:00 IST every night
  workflow_dispatch:        # allow manual Run workflow button

jobs:
  amfi-nav:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install deps
        run: pip install -r backend/requirements.txt

      - name: Run AMFI NAV ingest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}   # Neon pooled URL, must be set in repo secrets
          # Optional: OPENAI_API_KEY not needed for ETL
        run: python backend/app/etl/amfi_nav_ingest.py

      # Optional: keep Neon free tier warm (Neon idles after 5 min)
      - name: Ping healthz
        if: always()
        run: curl -fsS https://india-mf-finder-api.onrender.com/healthz || true
