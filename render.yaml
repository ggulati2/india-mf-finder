services:
  - type: web
    name: india-mf-finder-api
    runtime: docker
    plan: free
    region: singapore          # closest to India; change to oregon/frankfurt if needed
    branch: master
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHONUNBUFFERED
        value: 1
      - key: DATABASE_URL
        sync: false                      # set in Render dashboard → Environment: Neon pooled connection string
      - key: REDIS_URL
        sync: false                      # optional — leave empty to run without Redis on free tier
      - key: OPENAI_API_KEY
        sync: false                      # set in Render dashboard → Environment
      - key: NEXT_PUBLIC_API_URL
        value: https://india-mf-finder-api.onrender.com
      - key: CORS_ORIGINS
        value: https://app.mydomain.com,https://india-mf-finder.vercel.app
